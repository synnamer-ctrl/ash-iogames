<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 440" width="260" height="440">
  <title>Child, waving</title>
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#FBDBBE"/>
      <stop offset="1" stop-color="#F0BC93"/>
    </linearGradient>
    <linearGradient id="overall" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#8AB3E4"/>
      <stop offset="1" stop-color="#6A93CC"/>
    </linearGradient>
    <filter id="wc" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G" result="warp"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="2" seed="3" result="grain"/>
      <feColorMatrix in="grain" type="matrix" values="0 0 0 0 0.24  0 0 0 0 0.2  0 0 0 0 0.17  0 0 0 0.05 0" result="grainA"/>
      <feComposite in="grainA" in2="warp" operator="in" result="grainIn"/>
      <feMerge><feMergeNode in="warp"/><feMergeNode in="grainIn"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <ellipse cx="130" cy="428" rx="78" ry="10" fill="#38454A" opacity="0.16" filter="url(#soft)"/>
  <g filter="url(#wc)">
    <!-- legs -->
    <path d="M92 318 L88 404 C88 410 96 412 104 410 L112 318 Z" fill="url(#overall)" stroke="#3F5F8E" stroke-width="3" stroke-linejoin="round"/>
    <path d="M150 318 L154 404 C154 410 162 412 170 410 L168 318 Z" fill="url(#overall)" stroke="#3F5F8E" stroke-width="3" stroke-linejoin="round"/>
    <path d="M84 402 C82 414 84 422 98 422 L118 422 C122 420 118 404 112 402 Z" fill="#8E5F4E" stroke="#5A3B2E" stroke-width="3" stroke-linejoin="round"/>
    <path d="M150 402 C150 404 148 422 154 422 L172 422 C180 422 180 414 176 402 Z" fill="#8E5F4E" stroke="#5A3B2E" stroke-width="3" stroke-linejoin="round"/>
    <!-- shirt -->
    <path d="M84 196 C110 186 150 186 176 196 L184 300 C160 312 104 312 80 300 Z" fill="#F7A59B" stroke="#8E4A40" stroke-width="3.2" stroke-linejoin="round"/>
    <!-- overalls -->
    <path d="M96 236 L164 236 L172 330 C150 340 110 340 88 330 Z" fill="url(#overall)" stroke="#3F5F8E" stroke-width="3.2" stroke-linejoin="round"/>
    <path d="M110 232 L114 200 M150 232 L146 200" stroke="#3F5F8E" stroke-width="5" stroke-linecap="round"/>
    <circle cx="112" cy="250" r="4.5" fill="#FFD66B" stroke="#8E6E2E" stroke-width="1.6"/>
    <circle cx="148" cy="250" r="4.5" fill="#FFD66B" stroke="#8E6E2E" stroke-width="1.6"/>
    <path d="M104 292 C120 298 140 298 156 292" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
    <!-- left arm, relaxed -->
    <path d="M84 200 C64 218 58 262 62 290 C64 300 76 300 78 292 C80 262 90 230 96 216 Z" fill="#F7A59B" stroke="#8E4A40" stroke-width="3" stroke-linejoin="round"/>
    <path d="M62 292 C56 296 58 306 66 308 C74 310 80 304 78 298 Z" fill="url(#skin)" stroke="#A8664A" stroke-width="2.6" stroke-linejoin="round"/>
    <!-- right arm, waving up -->
    <path d="M176 200 C198 176 212 140 214 110 C216 98 232 98 232 110 C232 146 220 186 194 220 Z" fill="#F7A59B" stroke="#8E4A40" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="224" cy="100" r="14" fill="url(#skin)" stroke="#A8664A" stroke-width="2.6"/>
    <path d="M214 92 q4 -4 6 0 M226 88 q4 -4 6 0" stroke="#A8664A" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7"/>
    <!-- head -->
    <path d="M70 118 C66 74 96 46 130 46 C166 46 194 74 190 118 C188 156 164 180 130 180 C96 180 72 156 70 118 Z" fill="url(#skin)" stroke="#A8664A" stroke-width="3.4" stroke-linejoin="round"/>
    <!-- hair with a fringe -->
    <path d="M66 112 C60 66 92 40 132 40 C170 40 198 66 194 112 C184 92 168 84 150 80 C134 92 104 96 88 88 C78 96 70 104 66 112 Z" fill="#6B4A3A" stroke="#4A3026" stroke-width="3" stroke-linejoin="round"/>
    <path d="M90 66 C96 52 116 46 130 48" fill="none" stroke="#9A7460" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
    <!-- sun hat -->
    <path d="M42 82 C60 74 84 70 130 70 C176 70 200 74 218 82 C212 92 194 96 130 96 C66 96 48 92 42 82 Z" fill="#FFD66B" stroke="#B88A2E" stroke-width="3" stroke-linejoin="round"/>
    <path d="M86 70 C92 52 168 52 174 70 C172 76 88 76 86 70 Z" fill="#FFD66B" stroke="#B88A2E" stroke-width="3" stroke-linejoin="round"/>
    <path d="M86 78 C120 84 150 84 174 78" fill="none" stroke="#F58F83" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
    <!-- face -->
    <ellipse cx="104" cy="128" rx="6" ry="8" fill="#38454A"/>
    <ellipse cx="156" cy="128" rx="6" ry="8" fill="#38454A"/>
    <circle cx="106" cy="125" r="2.2" fill="#FFFFFF"/>
    <circle cx="158" cy="125" r="2.2" fill="#FFFFFF"/>
    <circle cx="90" cy="150" r="10" fill="#F58F83" opacity="0.5"/>
    <circle cx="170" cy="150" r="10" fill="#F58F83" opacity="0.5"/>
    <path d="M112 150 Q130 168 148 150" fill="#FFFFFF" stroke="#38454A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M118 156 Q130 162 142 156" fill="#F58F83" opacity="0.8"/>
    <!-- collar -->
    <path d="M112 186 C118 194 142 194 148 186" fill="none" stroke="#8E4A40" stroke-width="2.4" stroke-linecap="round"/>
  </g>
</svg>
