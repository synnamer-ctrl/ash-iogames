<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 260" width="440" height="260">
  <title>Small car</title>
  <defs>
    <linearGradient id="paint" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#FA9D90"/>
      <stop offset="1" stop-color="#E2706A"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAF8FF"/>
      <stop offset="1" stop-color="#9EDDF5"/>
    </linearGradient>
    <filter id="wc" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G" result="warp"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="2" seed="3" result="grain"/>
      <feColorMatrix in="grain" type="matrix" values="0 0 0 0 0.24  0 0 0 0 0.2  0 0 0 0 0.17  0 0 0 0.05 0" result="grainA"/>
      <feComposite in="grainA" in2="warp" operator="in" result="grainIn"/>
      <feMerge><feMergeNode in="warp"/><feMergeNode in="grainIn"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <ellipse cx="220" cy="236" rx="200" ry="12" fill="#38454A" opacity="0.16" filter="url(#soft)"/>
  <g filter="url(#wc)">
    <!-- body -->
    <path d="M40 176 C38 150 48 132 74 126 L146 106 C166 78 198 66 240 66 C280 66 306 92 330 118 L384 128 C412 134 424 150 424 178 L424 206 C424 214 416 218 404 218 L58 218 C46 218 40 210 40 198 Z" fill="url(#paint)" stroke="#8E4A40" stroke-width="3.6" stroke-linejoin="round"/>
    <!-- lower shade band -->
    <path d="M44 196 C120 206 320 206 418 194 L420 206 C420 214 412 218 402 218 L60 218 C48 218 42 210 44 196 Z" fill="#C9564D" opacity="0.45"/>
    <!-- windows -->
    <path d="M160 100 C176 90 204 88 226 88 L228 130 L144 130 C150 118 154 108 160 100 Z" fill="url(#glass)" stroke="#4E6B7E" stroke-width="3" stroke-linejoin="round"/>
    <path d="M240 88 C262 88 290 92 306 106 L318 130 L240 130 Z" fill="url(#glass)" stroke="#4E6B7E" stroke-width="3" stroke-linejoin="round"/>
    <path d="M174 98 C186 96 200 96 214 98" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
    <!-- roof highlight -->
    <path d="M118 118 C150 92 182 78 222 76" fill="none" stroke="#FFD0C8" stroke-width="7" stroke-linecap="round" opacity="0.85"/>
    <!-- door seam and handle -->
    <path d="M236 140 L236 206" stroke="#8E4A40" stroke-width="2.4" stroke-linecap="round" opacity="0.7"/>
    <rect x="262" y="160" width="18" height="6" rx="3" fill="#8E4A40" opacity="0.8"/>
    <!-- headlight and bumper -->
    <path d="M404 166 C412 162 420 166 420 176 C420 186 412 190 404 188 Z" fill="#FFD66B" stroke="#B88A2E" stroke-width="2.4"/>
    <ellipse cx="404" cy="176" rx="4" ry="3" fill="#FFFFFF" opacity="0.9"/>
    <path d="M48 196 L84 196" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
    <!-- wheel arches -->
    <path d="M70 218 C70 184 104 178 118 190 C126 198 132 210 132 218 Z" fill="#B9544C" opacity="0.6"/>
    <path d="M310 218 C310 184 344 178 358 190 C366 198 372 210 372 218 Z" fill="#B9544C" opacity="0.6"/>
  </g>
  <!-- wheels: separate group for animation -->
  <g id="wheel-rear" filter="url(#wc)">
    <circle cx="106" cy="218" r="34" fill="#3B4650" stroke="#25303A" stroke-width="3"/>
    <circle cx="106" cy="218" r="20" fill="#C9D3DA" stroke="#5B6A74" stroke-width="2"/>
    <circle cx="106" cy="218" r="6" fill="#FFD66B" stroke="#5B6A74" stroke-width="1.6"/>
    <path d="M106 200 v36 M88 218 h36" stroke="#8D9AA3" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M96 208 C100 200 112 198 118 202" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  </g>
  <g id="wheel-front" filter="url(#wc)">
    <circle cx="344" cy="218" r="34" fill="#3B4650" stroke="#25303A" stroke-width="3"/>
    <circle cx="344" cy="218" r="20" fill="#C9D3DA" stroke="#5B6A74" stroke-width="2"/>
    <circle cx="344" cy="218" r="6" fill="#FFD66B" stroke="#5B6A74" stroke-width="1.6"/>
    <path d="M344 200 v36 M326 218 h36" stroke="#8D9AA3" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M334 208 C338 200 350 198 356 202" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>
