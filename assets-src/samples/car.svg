<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 260" width="440" height="260">
  <title>Small car</title>
  <defs>
    <linearGradient id="paint" x1="0.1" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#FCB1A5"/>
      <stop offset="0.55" stop-color="#F58F83"/>
      <stop offset="1" stop-color="#E2706A"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3FBFF"/>
      <stop offset="0.6" stop-color="#B8E6F8"/>
      <stop offset="1" stop-color="#7CC6E6"/>
    </linearGradient>
    <radialGradient id="rim" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C5CFD6"/>
    </radialGradient>
    <filter id="wc" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" seed="9" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G" result="warp"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" seed="2" result="grain"/>
      <feColorMatrix in="grain" type="matrix" values="0 0 0 0 0.3  0 0 0 0 0.24  0 0 0 0 0.2  0 0 0 0.14 0" result="grainA"/>
      <feComposite in="grainA" in2="warp" operator="in" result="grainIn"/>
      <feMerge><feMergeNode in="warp"/><feMergeNode in="grainIn"/></feMerge>
    </filter>
    <filter id="blur1"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
    <clipPath id="bodyClip"><path id="bodyPath" d="M40 176 C38 150 48 132 74 126 L146 106 C166 78 198 66 240 66 C280 66 306 92 330 118 L384 128 C412 134 424 150 424 178 L424 206 C424 214 416 218 404 218 L58 218 C46 218 40 210 40 198 Z"/></clipPath>
  </defs>
  <ellipse cx="226" cy="238" rx="200" ry="11" fill="#38454A" opacity="0.16" filter="url(#soft)"/>
  <g filter="url(#wc)">
    <use href="#bodyPath" fill="url(#paint)"/>
    <g clip-path="url(#bodyClip)">
      <!-- lower pooled edge and shade -->
      <path d="M40 200 C140 212 320 212 430 198 L430 240 L40 240 Z" fill="#C9564D" opacity="0.4"/>
      <path d="M40 204 C140 216 320 216 430 202" fill="none" stroke="#B9463F" stroke-width="7" opacity="0.4" filter="url(#blur1)"/>
      <!-- side crease -->
      <path d="M46 150 C120 146 300 150 420 152" fill="none" stroke="#FFD0C8" stroke-width="4" opacity="0.5" stroke-linecap="round"/>
    </g>
    <use href="#bodyPath" fill="none" stroke="#8E4A40" stroke-width="3.6" stroke-linejoin="round"/>
    <!-- windows: gradient glass with reflections -->
    <path d="M160 100 C176 90 204 88 226 88 L228 130 L144 130 C150 118 154 108 160 100 Z" fill="url(#glass)" stroke="#4E6B7E" stroke-width="3" stroke-linejoin="round"/>
    <path d="M240 88 C262 88 290 92 306 106 L318 130 L240 130 Z" fill="url(#glass)" stroke="#4E6B7E" stroke-width="3" stroke-linejoin="round"/>
    <path d="M170 100 C184 96 200 96 214 98" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
    <path d="M252 102 C266 100 280 104 292 112" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <!-- highlights on the roof and bonnet -->
    <path d="M118 118 C150 92 182 78 222 76" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.85"/>
    <path d="M338 130 C362 136 386 140 410 144" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
    <!-- door seam, handle, mirror -->
    <path d="M236 140 L236 206" stroke="#8E4A40" stroke-width="2.4" stroke-linecap="round" opacity="0.7"/>
    <rect x="262" y="160" width="20" height="6" rx="3" fill="#8E4A40" opacity="0.85"/>
    <path d="M144 132 C138 140 138 150 146 152" fill="none" stroke="#8E4A40" stroke-width="3" stroke-linecap="round"/>
    <!-- headlight, grille and bumper -->
    <path d="M400 164 C410 158 422 164 422 176 C422 188 410 192 400 188 Z" fill="#FFE49A" stroke="#B88A2E" stroke-width="2.4"/>
    <ellipse cx="408" cy="170" rx="4" ry="3" fill="#FFFFFF" opacity="0.95"/>
    <path d="M414 196 C420 196 424 198 424 204 L404 210 Z" fill="#B9463F" opacity="0.5"/>
    <!-- wheel arches -->
    <path d="M68 218 C68 184 104 176 120 190 C128 198 134 210 134 218 Z" fill="#8E3F38" opacity="0.5"/>
    <path d="M308 218 C308 184 344 176 360 190 C368 198 374 210 374 218 Z" fill="#8E3F38" opacity="0.5"/>
  </g>
  <g id="wheel-rear" filter="url(#wc)">
    <circle cx="106" cy="218" r="34" fill="#3B4650" stroke="#25303A" stroke-width="3"/>
    <circle cx="106" cy="218" r="22" fill="url(#rim)" stroke="#5B6A74" stroke-width="2"/>
    <circle cx="106" cy="218" r="7" fill="#FFD66B" stroke="#5B6A74" stroke-width="1.6"/>
    <path d="M106 198 v40 M86 218 h40 M92 204 L120 232 M120 204 L92 232" stroke="#8D9AA3" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M92 206 C96 198 110 196 118 200" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  </g>
  <g id="wheel-front" filter="url(#wc)">
    <circle cx="344" cy="218" r="34" fill="#3B4650" stroke="#25303A" stroke-width="3"/>
    <circle cx="344" cy="218" r="22" fill="url(#rim)" stroke="#5B6A74" stroke-width="2"/>
    <circle cx="344" cy="218" r="7" fill="#FFD66B" stroke="#5B6A74" stroke-width="1.6"/>
    <path d="M344 198 v40 M324 218 h40 M330 204 L358 232 M358 204 L330 232" stroke="#8D9AA3" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M330 206 C334 198 348 196 356 200" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>
