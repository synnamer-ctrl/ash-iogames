<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 440" width="300" height="440">
  <title>Sunflower</title>
  <defs>
    <radialGradient id="petal" cx="0.5" cy="0.1" r="1">
      <stop offset="0" stop-color="#FFEFA8"/>
      <stop offset="0.6" stop-color="#FFD66B"/>
      <stop offset="1" stop-color="#EFA53E"/>
    </radialGradient>
    <radialGradient id="disc" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#B07A52"/>
      <stop offset="0.7" stop-color="#7A4D31"/>
      <stop offset="1" stop-color="#5A3722"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C6E9AE"/>
      <stop offset="1" stop-color="#6FA96A"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A9D595"/>
      <stop offset="1" stop-color="#5E9A5C"/>
    </linearGradient>
    <filter id="wc" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" seed="17" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G" result="warp"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" seed="6" result="grain"/>
      <feColorMatrix in="grain" type="matrix" values="0 0 0 0 0.3  0 0 0 0 0.24  0 0 0 0 0.2  0 0 0 0.14 0" result="grainA"/>
      <feComposite in="grainA" in2="warp" operator="in" result="grainIn"/>
      <feMerge><feMergeNode in="warp"/><feMergeNode in="grainIn"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
    <path id="petalShape" d="M0 0 C-24 -16 -28 -64 -10 -90 C-3 -99 3 -99 10 -90 C28 -64 24 -16 0 0 Z"/>
  </defs>
  <ellipse cx="150" cy="430" rx="84" ry="9" fill="#38454A" opacity="0.16" filter="url(#soft)"/>
  <g filter="url(#wc)">
    <path d="M146 196 C140 270 156 330 148 424" fill="none" stroke="#3F6E42" stroke-width="13" stroke-linecap="round" opacity="0.8"/>
    <path d="M146 196 C140 270 156 330 148 424" fill="none" stroke="url(#stem)" stroke-width="8" stroke-linecap="round"/>
    <path d="M147 250 C150 270 152 290 148 314" fill="none" stroke="#3F6E42" stroke-width="1.8" opacity="0.6"/>
    <!-- leaves: wash, pooled edge, midrib -->
    <path d="M146 330 C112 316 84 292 74 252 C112 262 138 284 146 330 Z" fill="url(#leaf)" stroke="#3F6E42" stroke-width="3" stroke-linejoin="round"/>
    <path d="M90 268 C104 282 122 292 142 304" fill="none" stroke="#3F6E42" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
    <path d="M80 258 C94 262 104 266 110 272" fill="none" stroke="#EAF7DA" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <path d="M150 300 C186 290 214 266 222 226 C188 236 160 258 150 300 Z" fill="url(#leaf)" stroke="#3F6E42" stroke-width="3" stroke-linejoin="round"/>
    <path d="M214 240 C200 258 180 272 158 288" fill="none" stroke="#3F6E42" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
    <path d="M186 254 C198 250 208 244 214 236" fill="none" stroke="#EAF7DA" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  </g>
  <!-- 14 petals: each a shaped path with a warm edge and a light vein -->
  <g transform="translate(150 118)" filter="url(#wc)">
    <g fill="url(#petal)" stroke="#B9782E" stroke-width="2.6" stroke-linejoin="round">
      <use href="#petalShape" transform="rotate(0)"/><use href="#petalShape" transform="rotate(26)"/>
      <use href="#petalShape" transform="rotate(52)"/><use href="#petalShape" transform="rotate(78)"/>
      <use href="#petalShape" transform="rotate(103)"/><use href="#petalShape" transform="rotate(129)"/>
      <use href="#petalShape" transform="rotate(154)"/><use href="#petalShape" transform="rotate(180)"/>
      <use href="#petalShape" transform="rotate(206)"/><use href="#petalShape" transform="rotate(231)"/>
      <use href="#petalShape" transform="rotate(257)"/><use href="#petalShape" transform="rotate(283)"/>
      <use href="#petalShape" transform="rotate(309)"/><use href="#petalShape" transform="rotate(334)"/>
    </g>
    <g fill="none" stroke="#FFFBE6" stroke-width="2.4" stroke-linecap="round" opacity="0.75">
      <path d="M0 -12 C-6 -36 -6 -60 0 -78"/>
      <path d="M0 -12 C-6 -36 -6 -60 0 -78" transform="rotate(103)"/>
      <path d="M0 -12 C-6 -36 -6 -60 0 -78" transform="rotate(206)"/>
      <path d="M0 -12 C-6 -36 -6 -60 0 -78" transform="rotate(309)"/>
    </g>
    <!-- disc: seeds in spirals, pooled rim -->
    <circle r="41" fill="url(#disc)" stroke="#4F3322" stroke-width="3"/>
    <circle r="36" fill="none" stroke="#3B2619" stroke-width="2" opacity="0.5"/>
    <g fill="#2E1D12" opacity="0.7">
      <circle cx="-14" cy="-10" r="2.5"/><circle cx="2" cy="-17" r="2.5"/><circle cx="17" cy="-7" r="2.5"/>
      <circle cx="-23" cy="6" r="2.5"/><circle cx="-7" cy="5" r="2.5"/><circle cx="10" cy="9" r="2.5"/>
      <circle cx="23" cy="14" r="2.5"/><circle cx="-17" cy="21" r="2.5"/><circle cx="2" cy="23" r="2.5"/>
      <circle cx="17" cy="25" r="2.5"/><circle cx="-7" cy="31" r="2.5"/><circle cx="8" cy="34" r="2.5"/>
    </g>
    <path d="M-24 -22 C-14 -32 -2 -34 6 -28" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
  </g>
  <!-- friendly face on the disc -->
  <g transform="translate(150 118)">
    <ellipse cx="-12" cy="-4" rx="3.6" ry="4.6" fill="#2A1A10"/>
    <ellipse cx="12" cy="-4" rx="3.6" ry="4.6" fill="#2A1A10"/>
    <circle cx="-11" cy="-6" r="1.3" fill="#FFFFFF"/>
    <circle cx="13" cy="-6" r="1.3" fill="#FFFFFF"/>
    <circle cx="-20" cy="8" r="5" fill="#F58F83" opacity="0.5"/>
    <circle cx="20" cy="8" r="5" fill="#F58F83" opacity="0.5"/>
    <path d="M-6 8 Q0 14 6 8" fill="none" stroke="#2A1A10" stroke-width="2.4" stroke-linecap="round"/>
  </g>
</svg>
