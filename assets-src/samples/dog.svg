<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" width="360" height="300">
  <title>Puppy</title>
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#FFFBF3"/>
      <stop offset="1" stop-color="#E9D7BC"/>
    </linearGradient>
    <linearGradient id="patch" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#C98A4C"/>
      <stop offset="1" stop-color="#A86A36"/>
    </linearGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#A46C44"/>
      <stop offset="1" stop-color="#7A4C2E"/>
    </linearGradient>
    <filter id="wc" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="21" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G" result="warp"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" seed="4" result="grain"/>
      <feColorMatrix in="grain" type="matrix" values="0 0 0 0 0.3  0 0 0 0 0.24  0 0 0 0 0.2  0 0 0 0.14 0" result="grainA"/>
      <feComposite in="grainA" in2="warp" operator="in" result="grainIn"/>
      <feMerge><feMergeNode in="warp"/><feMergeNode in="grainIn"/></feMerge>
    </filter>
    <filter id="blur1"><feGaussianBlur stdDeviation="1.3"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <ellipse cx="172" cy="288" rx="136" ry="9" fill="#38454A" opacity="0.16" filter="url(#soft)"/>
  <g filter="url(#wc)">
    <!-- tail -->
    <path d="M86 170 C62 148 52 114 62 92" fill="none" stroke="#38454A" stroke-width="15" stroke-linecap="round" opacity="0.85"/>
    <path d="M86 170 C62 148 52 114 62 92" fill="none" stroke="#C98A4C" stroke-width="9" stroke-linecap="round"/>
    <!-- far legs -->
    <path d="M106 226 L100 282 C100 288 110 290 118 288 L124 226 Z" fill="#DCC6A6" stroke="#8E7456" stroke-width="3" stroke-linejoin="round"/>
    <path d="M236 226 L232 282 C232 288 242 290 250 288 L256 226 Z" fill="#DCC6A6" stroke="#8E7456" stroke-width="3" stroke-linejoin="round"/>
    <!-- body -->
    <path d="M86 178 C78 146 120 128 178 130 C236 132 268 146 274 176 C280 204 262 218 240 218 L120 218 C98 218 90 200 86 178 Z" fill="url(#fur)" stroke="#8E7456" stroke-width="3.6" stroke-linejoin="round"/>
    
    <path d="M126 152 C146 132 182 132 198 148 C208 162 198 182 178 184 C160 188 136 182 126 172 C118 166 120 158 126 152 Z" fill="url(#patch)"/>
    <path d="M230 138 C242 132 256 142 258 156 C248 164 234 160 228 152 Z" fill="url(#patch)"/>
    <path d="M92 188 C102 182 112 188 114 198 C106 206 94 204 92 188 Z" fill="url(#patch)"/>
    <path d="M100 176 C110 170 118 174 120 182" fill="none" stroke="#E1A56C" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <!-- near legs -->
    <path d="M160 206 L156 282 C156 288 166 290 174 288 L180 206 Z" fill="url(#fur)" stroke="#8E7456" stroke-width="3.2" stroke-linejoin="round"/>
    <path d="M222 206 L218 282 C218 288 228 290 236 288 L242 206 Z" fill="url(#fur)" stroke="#8E7456" stroke-width="3.2" stroke-linejoin="round"/>
    <path d="M152 284 C150 292 158 296 172 296 L178 296 C182 292 180 286 176 284 Z" fill="#FFFBF3" stroke="#8E7456" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M214 284 C212 292 220 296 234 296 L240 296 C244 292 242 286 238 284 Z" fill="#FFFBF3" stroke="#8E7456" stroke-width="2.4" stroke-linejoin="round"/>
    <!-- head -->
    <path d="M250 100 C248 66 272 52 292 54 C320 56 334 80 330 104 C326 130 306 146 286 144 C264 142 252 124 250 100 Z" fill="url(#fur)" stroke="#8E7456" stroke-width="3.6" stroke-linejoin="round"/>
    <path d="M262 80 C272 64 300 62 312 76 C306 88 282 92 262 80 Z" fill="url(#patch)"/>
    <path d="M266 62 C280 56 300 58 306 66" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <!-- floppy ear -->
    <path d="M268 70 C244 74 232 106 240 138 C246 152 262 150 268 134 C274 116 276 94 268 70 Z" fill="url(#ear)" stroke="#5A3B2E" stroke-width="3" stroke-linejoin="round"/>
    <path d="M256 96 C252 112 254 126 260 134" fill="none" stroke="#C9915A" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <!-- muzzle and nose -->
    <ellipse cx="318" cy="122" rx="24" ry="17" fill="#FFFBF3" stroke="#8E7456" stroke-width="2.6"/>
    <path d="M304 110 C312 104 324 106 330 114" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <path d="M302 134 C312 142 326 140 334 132" fill="none" stroke="#C9A77E" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <ellipse cx="338" cy="108" rx="7" ry="5" fill="#38454A"/>
    <ellipse cx="336" cy="106" rx="2" ry="1.4" fill="#FFFFFF" opacity="0.8"/>
    <!-- eye with brow and glint -->
    <ellipse cx="300" cy="90" rx="6" ry="7.5" fill="#38454A"/>
    <circle cx="302" cy="87" r="2.2" fill="#FFFFFF"/>
    <path d="M288 80 Q298 74 308 80" fill="none" stroke="#5A3B2E" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="284" cy="110" r="8" fill="#F58F83" opacity="0.4"/>
    <path d="M320 140 Q328 146 336 140" fill="none" stroke="#38454A" stroke-width="2.4" stroke-linecap="round"/>
    <!-- bandana under the chin -->
    <path d="M252 138 C268 156 302 158 322 140 L300 190 C288 196 274 190 262 180 Z" fill="#F58F83" stroke="#8E4A40" stroke-width="3" stroke-linejoin="round"/>
    <path d="M276 166 C284 170 292 170 298 166" fill="none" stroke="#FFD8D0" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>
